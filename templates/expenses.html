
{% extends "layout.html" %}
{% block body %}
<h1>المصروفات</h1>
<form method="post" class="inline"><input name="title" placeholder="بيان المصروف"><input name="amount" type="number" step="0.01" placeholder="المبلغ"><input name="expense_date" type="date" value="{{ today }}"><input name="notes" placeholder="ملاحظات"><button>إضافة</button></form>
<table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>ملاحظات</th></tr>
{% for r in rows %}<tr><td>{{ r.expense_date }}</td><td>{{ r.title }}</td><td>{{ r.amount }}</td><td>{{ r.notes }}</td></tr>{% endfor %}
</table>
{% endblock %}
