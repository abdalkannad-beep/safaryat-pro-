
{% extends "layout.html" %}
{% block body %}
<h1>الأصناف والأسعار</h1>
<form method="post" class="inline"><input name="name" placeholder="اسم الصنف"><input name="price" type="number" step="0.01" placeholder="السعر"><button>إضافة</button></form>
<table><tr><th>الصنف</th><th>السعر</th><th>نشط</th><th>حفظ</th></tr>
{% for r in rows %}
<tr><form method="post" action="{{ url_for('category_update', cid=r.id) }}"><td><input name="name" value="{{ r.name }}"></td><td><input name="price" type="number" step="0.01" value="{{ r.price }}"></td><td><select name="active"><option value="1" {% if r.active %}selected{% endif %}>نعم</option><option value="0" {% if not r.active %}selected{% endif %}>لا</option></select></td><td><button>حفظ</button></td></form></tr>
{% endfor %}
</table>
{% endblock %}
